networkPolicy:
  enabled: true
  ingress:
    namespaceSelector: {}
    podSelector: {}

ciliumNetworkPolicy:
  enabled: true

verticalPodAutoscaler:
  trivy:
    enabled: true
    containerPolicies: {}

# Enable Kyverno PolicyException
kyvernoPolicyExceptions:
  enabled: true
  namespace: giantswarm
  legacy:
    # -- Render the kyverno.io/v2 PolicyException, which only applies to ClusterPolicies. Turn it off once the cluster runs the CEL policies.
    enabled: true
  cel:
    # -- Render the policies.kyverno.io/v1 PolicyException, which only applies to CEL policies (ValidatingPolicy).
    enabled: true

trivy:  # @schema skipProperties: true; additionalProperties: true
  # ephemeral-storage bounds the tmp-data emptyDir (require-emptydir-requests-and-limits); cpu/memory come from upstream.
  resources:
    requests:
      ephemeral-storage: 256Mi
    limits:
      ephemeral-storage: 2Gi
  rbac:
    pspEnabled: false
  image:
    registry: gsoci.azurecr.io
    repository: giantswarm/trivy
    # Tag must also be updated to match in trivy-operator-app
    # If not set here, the image version is taken from the appVersion of the upstream chart.
  securityContext:
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false

  # Allow Trivy to download the database before being killed. In some cases the conection to gsoci can be slow and take longer than the default
  # Maybe we can remove this once we have Zot

  trivy:
    dbRepository: gsoci.azurecr.io/giantswarm/trivy-db
