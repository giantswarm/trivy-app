{{- if and .Values.kyvernoPolicyExceptions.enabled .Values.kyvernoPolicyExceptions.legacy.enabled }}
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: {{ include "trivy.fullname" . }}-exception
  namespace: {{ .Values.kyvernoPolicyExceptions.namespace | default .Release.Namespace }}
  labels:
    policy.giantswarm.io/migrated-to-cel: "true"
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
spec:
  exceptions:
  - policyName: disallow-capabilities-strict
    ruleNames:
    - require-drop-all
    - autogen-require-drop-all
  - policyName: restrict-seccomp-strict
    ruleNames:
    - check-seccomp-strict
    - autogen-check-seccomp-strict
  match:
    any:
    - resources:
        kinds:
        - StatefulSet
        - Pod
        namespaces:
        - {{ .Release.Namespace }}
        names:
        - {{ include "trivy.fullname" . }}*
{{- end -}}
